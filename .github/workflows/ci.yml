name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out

      # Dua angka, keduanya jujur dan keduanya perlu dibaca bersama.
      # Total repo rendah karena controller dan repository warisan belum
      # punya test; layer yang memang digarap ada di 100%. Mencetak hanya
      # salah satunya akan menyesatkan ke salah satu arah.
      - name: Coverage summary
        run: |
          echo "== Per fungsi, layer yang dites =="
          go tool cover -func=coverage.out | grep -Ev '\s0\.0%$' | grep -v '^total:'
          echo
          echo "== Total seluruh repo (termasuk paket tanpa test) =="
          go tool cover -func=coverage.out | tail -1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t go-food-store:ci .

  # Bukti terbuka: stack asli dinyalakan, endpoint asli ditembak, output
  # mentahnya diterbitkan di halaman run. Tautan "Live" di portfolio
  # mengarah ke sini. Job `test` tetap yang menentukan hijau-merahnya PR.
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # --wait cukup karena service api punya healthcheck sendiri
      # (lihat docker-compose.yml) — yang ditunggu endpoint yang menjawab.
      - name: Nyalakan stack
        run: docker compose up -d --build --wait

      - name: Rekam request & response
        run: |
          {
            echo '## Request dan response nyata'
            echo
            echo 'Dihasilkan oleh `scripts/proof.sh` terhadap stack yang'
            echo 'benar-benar berjalan di runner ini. Tidak ada yang diketik tangan.'
            echo
            echo '```http'
            ./scripts/proof.sh
            echo '```'
          } | tee proof.md >> "$GITHUB_STEP_SUMMARY"

      # Tanpa ini job tidak pernah bisa merah: kontrak API selalu membalas
      # HTTP 200, kode error hanya di body — route yang rusak pun lolos
      # `set -e` maupun `curl -f`. Satu penanda dari ujung alur sudah cukup.
      - name: Pastikan alurnya benar-benar jalan
        run: grep -q '"AlreadyPay": true' proof.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: proof.md

      # Log container hanya saat gagal — kalau hijau, isinya cuma derau.
      - name: Log container kalau gagal
        if: failure()
        run: docker compose logs --no-color
