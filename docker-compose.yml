services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: go-food-store
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DB_USER: root
      DB_PASSWORD: ""
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: go-food-store
      SERVER_ADDR: ":8080"
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # Tanpa ini `--wait` menganggap api sehat begitu prosesnya jalan, padahal
    # koneksi DB dan migrasi belum selesai. wget ada di image alpine.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
